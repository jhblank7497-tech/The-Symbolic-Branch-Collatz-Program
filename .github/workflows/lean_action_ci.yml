name: Lean Action CI
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://lean-lang.org | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Resolve dependencies and fetch Mathlib cache
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install $(cat lean-toolchain)
          lake update
          lake exe cache get
      - name: Build Lean project
        run: |
          export PATH="$HOME/.elan/bin:$PATH"
          lake build
