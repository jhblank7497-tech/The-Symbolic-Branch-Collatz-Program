name: Lean Action CI
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install elan and Lean toolchain
        run: |
          curl https://githubusercontent.com -sSf | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
      - name: Resolve dependencies and fetch Mathlib cache
        run: |
          lake update
          lake exe cache get
      - name: Build Lean project
        run: |
          lake build
